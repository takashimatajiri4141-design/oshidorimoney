<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おしどりの財布</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おしどり財布">
<meta name="theme-color" content="#FBF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #FBF3F0; --surface: #FFFFFF; --surface-2: #FDF7F5; --ink: #3A2B33;
    --ink-soft: #93777F; --rose: #E56B93; --rose-deep: #C9527B; --rose-soft: #FBE3EC;
    --teal: #2F8F9D; --teal-deep: #23707C; --teal-soft: #DDEFF1;
    --sage: #4E9E80; --sage-soft: #E1F0E9; --amber: #D68A38; --amber-soft: #FBEEDC;
    --line: #F0E1E5; --shadow: 0 6px 22px rgba(200,120,150,0.14); --shadow-sm: 0 2px 8px rgba(200,120,150,0.12);
    --radius: 20px;
    --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
      --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
      --teal: #62BAC7; --teal-deep: #62BAC7; --teal-soft: #23383D;
      --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
      --line: #3D2C37; --shadow: 0 6px 22px rgba(0,0,0,0.35); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #FBF3F0; --surface: #FFFFFF; --surface-2: #FDF7F5; --ink: #3A2B33;
    --ink-soft: #93777F; --rose: #E56B93; --rose-deep: #C9527B; --rose-soft: #FBE3EC;
    --teal: #2F8F9D; --teal-deep: #23707C; --teal-soft: #DDEFF1;
    --sage: #4E9E80; --sage-soft: #E1F0E9; --amber: #D68A38; --amber-soft: #FBEEDC;
    --line: #F0E1E5; --shadow: 0 6px 22px rgba(200,120,150,0.14); --shadow-sm: 0 2px 8px rgba(200,120,150,0.12);
  }
  :root[data-theme="dark"] {
    --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
    --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
    --teal: #62BAC7; --teal-deep: #62BAC7; --teal-soft: #23383D;
    --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
    --line: #3D2C37; --shadow: 0 6px 22px rgba(0,0,0,0.35); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }

  .app {
    font-family: var(--font-body); color: var(--ink);
    background:
      radial-gradient(120% 90% at 90% -10%, var(--rose-soft) 0%, transparent 55%),
      radial-gradient(120% 90% at 0% 0%, var(--teal-soft) 0%, transparent 45%),
      var(--bg);
    min-height: 100vh;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto; -webkit-font-smoothing: antialiased;
  }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark { width: 36px; height: 36px; border-radius: 11px; flex: none; background: linear-gradient(140deg, #FFF1EA 0%, #FBD9CB 100%); box-shadow: var(--shadow-sm); display: grid; place-items: center; overflow: hidden; }
  .brand .mark svg { width: 30px; height: 30px; }
  .brand h1 { font-family: var(--font-round); font-size: 1.06rem; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .gear { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--surface); color: var(--ink-soft); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; place-items: center; }
  .gear svg { width: 21px; height: 21px; }

  .monthbar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .monthbar button { width: 34px; height: 34px; border-radius: 11px; border: none; background: var(--surface); color: var(--rose); box-shadow: var(--shadow-sm); font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; transition: transform .12s ease; }
  .monthbar button:active { transform: scale(.9); }
  .monthbar .label { font-family: var(--font-round); font-weight: 700; font-size: 1.02rem; min-width: 116px; text-align: center; font-variant-numeric: tabular-nums; }

  .note { font-size: .8rem; border-radius: 13px; padding: 10px 13px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; margin-bottom: 16px; }
  .note.done { background: var(--sage-soft); color: var(--sage); }
  .note svg { flex: none; width: 16px; height: 16px; margin-top: 1px; }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 11px; }
  .section-head h2 { font-family: var(--font-round); font-size: 1rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
  .section-head h2 .tag { font-size: .68rem; font-weight: 600; color: var(--ink-soft); background: var(--surface); padding: 2px 8px; border-radius: 99px; font-family: var(--font-body); box-shadow: var(--shadow-sm); }
  .add-btn { border: none; background: none; color: var(--rose); font-family: var(--font-body); font-weight: 700; font-size: .85rem; cursor: pointer; padding: 4px 6px; display: flex; align-items: center; gap: 4px; border-radius: 10px; }
  .add-btn.teal { color: var(--teal-deep); }
  .add-btn:active { background: var(--surface-2); }
  .add-btn svg { width: 15px; height: 15px; }

  .group { margin-bottom: 20px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 9px; }
  .group-head .g-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: .9rem; }
  .group-head .g-title .gsym { width: 21px; height: 21px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-round); font-weight: 800; font-size: .82rem; background: var(--rose-soft); color: var(--rose-deep); }
  .group.m .group-head .g-title .gsym { background: var(--teal-soft); color: var(--teal-deep); }
  .group.c .group-head .g-title .gsym, .set-group-h.c .gsym { background: color-mix(in srgb, #9575B8 20%, var(--surface)); color: #9575B8; }
  .acct-list { display: flex; flex-direction: column; gap: 10px; }

  /* account accordion */
  .acct-card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm); border: 1.5px solid transparent; overflow: hidden; transition: border-color .2s ease; }
  .acct-card.done { border-color: color-mix(in srgb, var(--sage) 40%, transparent); }
  .ac-head { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; }
  .ac-ic { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--surface-2); font-size: 1.35rem; }
  .ac-name { flex: 1; min-width: 0; }
  .ac-name .n { font-weight: 700; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-name .sub { font-size: .73rem; color: var(--ink-soft); margin-top: 2px; }
  .ac-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .ac-amt { font-family: var(--font-round); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .ac-amt .yen { font-size: .78rem; color: var(--ink-soft); font-weight: 600; margin-right: 1px; }
  .ac-pill { font-size: .64rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; display: flex; align-items: center; gap: 3px; }
  .ac-pill.todo { background: var(--amber-soft); color: var(--amber); }
  .ac-pill.ok { background: var(--sage-soft); color: var(--sage); }
  .ac-pill svg { width: 11px; height: 11px; }
  .ac-arrow { color: var(--ink-soft); font-size: 1rem; transition: transform .2s ease; flex: none; }
  .acct-card.open .ac-arrow { transform: rotate(90deg); }
  .ac-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .memo-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .8rem; color: var(--ink); line-height: 1.55; margin: 12px 0; display: flex; gap: 8px; align-items: flex-start; white-space: pre-wrap; }
  .memo-box svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--ink-soft); }
  .items-h { font-size: .74rem; color: var(--ink-soft); font-weight: 600; margin: 12px 2px 8px; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 11px; cursor: pointer; margin-bottom: 7px; }
  .item-row:active { background: var(--rose-soft); }
  .item-row .ir-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .item-row .in { font-size: .9rem; font-weight: 600; }
  .item-row .im { font-size: .72rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-row .ia { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .98rem; }
  .item-row .ia .yen { font-size: .74rem; color: var(--ink-soft); margin-right: 1px; }
  .item-empty { font-size: .8rem; color: var(--ink-soft); padding: 10px 2px; }
  .add-item { width: 100%; border: 1.5px dashed var(--line); background: none; color: var(--ink-soft); border-radius: 11px; padding: 10px; font-family: var(--font-body); font-weight: 700; font-size: .84rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 2px; }
  .add-item:active { background: var(--surface-2); }
  .add-item svg { width: 14px; height: 14px; }
  .citem { background: var(--surface-2); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; }
  .citem.done { background: color-mix(in srgb, var(--sage-soft) 55%, var(--surface-2)); }
  .citem.skip { opacity: .5; }
  .citem .ci-top { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .citem .ir-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .citem .in { font-size: .92rem; font-weight: 600; }
  .citem .im { font-size: .72rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .citem .ia { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .98rem; flex: none; }
  .citem .ia .yen { font-size: .74rem; color: var(--ink-soft); margin-right: 1px; }
  .citem.skip .in, .citem.skip .ia { text-decoration: line-through; }
  .ci-actions { display: flex; gap: 8px; margin-top: 10px; }
  .ci-btn { flex: 1; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 10px; padding: 9px; font-family: var(--font-body); font-weight: 700; font-size: .82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: transform .1s ease; }
  .ci-btn:active { transform: scale(.98); }
  .ci-btn svg { width: 15px; height: 15px; }
  .citem.done .done-btn { background: var(--sage); border-color: var(--sage); color: #fff; }
  @media (prefers-color-scheme: dark) { .citem.done .done-btn { color: #12241C; } }
  :root[data-theme="dark"] .citem.done .done-btn { color: #12241C; }
  :root[data-theme="light"] .citem.done .done-btn { color: #fff; }
  .ci-btn.skip-btn.on { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 40%, transparent); color: var(--amber); }
  .deposit-note { font-size: .76rem; color: var(--ink-soft); background: var(--surface-2); border-radius: 11px; padding: 9px 12px; margin-top: 12px; line-height: 1.6; text-align: center; }
  .deposit-note b { font-family: var(--font-round); color: var(--ink); font-variant-numeric: tabular-nums; }
  .ac-actions { margin-top: 14px; }
  .doneat { text-align: center; font-size: .76rem; color: var(--sage); font-weight: 600; margin-bottom: 8px; }
  .check { width: 100%; border: none; cursor: pointer; border-radius: 12px; padding: 12px; font-family: var(--font-body); font-weight: 700; font-size: .92rem; display: flex; align-items: center; justify-content: center; gap: 7px; transition: transform .1s ease; }
  .check:active { transform: scale(.98); }
  .check svg { width: 17px; height: 17px; }
  .check.todo { background: linear-gradient(140deg, var(--rose) 0%, var(--rose-deep) 100%); color: #fff; box-shadow: var(--shadow-sm); }
  .check.ok { background: var(--sage-soft); color: var(--sage); }
  .group-empty { text-align: center; color: var(--ink-soft); font-size: .84rem; padding: 18px 10px; background: var(--surface); border-radius: 15px; box-shadow: var(--shadow-sm); border: 1.5px dashed var(--line); }

  .bm-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 24px; }
  .bm { background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 11px; }
  .bm .bm-ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-deep); }
  .bm .bm-ic svg { width: 17px; height: 17px; }
  .bm .bm-main { flex: 1; min-width: 0; cursor: pointer; }
  .bm .bm-label { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm .bm-url { font-size: .72rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm .bm-edit { border: none; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; flex: none; cursor: pointer; display: grid; place-items: center; }
  .bm .bm-edit svg { width: 15px; height: 15px; }

  .card { background: var(--surface); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
  .gseg { display: inline-flex; background: var(--surface-2); border-radius: 99px; padding: 3px; gap: 2px; margin-bottom: 12px; }
  .gseg button { border: none; background: none; color: var(--ink-soft); font-family: var(--font-body); font-weight: 700; font-size: .78rem; padding: 6px 14px; border-radius: 99px; cursor: pointer; }
  .gseg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .chart-legend { display: flex; gap: 14px; margin-bottom: 6px; }
  .chart-legend span { font-size: .72rem; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }
  .chart-legend .dot { width: 9px; height: 9px; border-radius: 3px; }
  .chart-note { font-size: .76rem; color: var(--ink-soft); text-align: center; padding: 10px 4px; line-height: 1.5; }
  .diff { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .diff .dh { font-size: .76rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
  .diff-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: .85rem; }
  .diff-row .dn { font-weight: 600; }
  .diff-row .dv { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-round); font-variant-numeric: tabular-nums; }
  .diff-row .now { font-weight: 700; }
  .delta { font-size: .74rem; font-weight: 700; }
  .delta.up { color: var(--amber); } .delta.down { color: var(--sage); } .delta.same { color: var(--ink-soft); }
  .spark-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .spark-row:last-child { border-bottom: none; }
  .spark-row .sr-name { flex: 1; min-width: 0; font-size: .86rem; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark-row .sr-ic { font-size: 1.05rem; flex: none; }
  .spark-row svg { flex: none; }
  .spark-row .sr-val { font-family: var(--font-round); font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums; text-align: right; min-width: 62px; }

  .footer-tip { text-align: center; color: var(--ink-soft); font-size: .74rem; line-height: 1.6; margin-top: 4px; padding: 0 10px; }

  /* bottom sheet */
  .scrim { position: fixed; inset: 0; background: rgba(40,25,35,.45); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 60; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; transform: translateY(110%); transition: transform .32s cubic-bezier(.3,1,.4,1); box-shadow: 0 -8px 30px rgba(0,0,0,.18); max-height: 90vh; overflow-y: auto; }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 16px; }
  .sheet h3 { font-family: var(--font-round); font-size: 1.15rem; margin: 0 0 18px; font-weight: 700; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: .78rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 7px; }
  .field input, .field textarea { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 13px; padding: 13px 14px; font-size: 1.05rem; font-family: var(--font-body); outline: none; transition: border-color .15s ease; resize: none; }
  .field input:focus, .field textarea:focus { border-color: var(--rose); }
  .field input.amt-input { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .chip { border: none; background: var(--rose-soft); color: var(--rose-deep); cursor: pointer; border-radius: 99px; padding: 6px 12px; font-size: .8rem; font-weight: 600; font-family: var(--font-body); }
  .chip:active { background: var(--rose); color: #fff; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink-soft); border-radius: 12px; padding: 11px; font-weight: 700; font-family: var(--font-body); font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button .s { font-family: var(--font-round); font-size: 1rem; }
  .seg button.on.f { border-color: var(--rose); background: var(--rose-soft); color: var(--rose-deep); }
  .seg button.on.m { border-color: var(--teal); background: var(--teal-soft); color: var(--teal-deep); }
  .seg.seg3 button { padding: 11px 4px; font-size: .82rem; gap: 4px; }
  .seg button.on.c { border-color: #9575B8; background: color-mix(in srgb, #9575B8 18%, var(--surface-2)); color: #9575B8; }
  .icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .icons button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 0; font-size: 1.3rem; line-height: 1; cursor: pointer; }
  .icons button.on { border-color: var(--rose); background: var(--rose-soft); }
  .switch { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .switch .track { width: 48px; height: 28px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s ease; flex: none; }
  .switch.on .track { background: var(--teal); }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s ease; }
  .switch.on .knob { left: 23px; }
  .switch .lbl { font-size: .92rem; font-weight: 700; }
  .switch .lbl small { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 500; margin-top: 1px; }
  .stepper { display: flex; gap: 8px; margin-top: 9px; }
  .stepper button { flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 11px; padding: 10px; font-family: var(--font-round); font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; cursor: pointer; }
  .stepper button:active { background: var(--teal-soft); }
  .hint { font-size: .74rem; color: var(--teal-deep); margin-top: 8px; font-weight: 600; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; border: none; border-radius: 14px; padding: 14px; font-size: .98rem; font-weight: 700; font-family: var(--font-body); cursor: pointer; transition: transform .1s ease; }
  .btn:active { transform: scale(.98); }

  .menu-scrim.show { opacity: 1; pointer-events: auto; }
  .menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 58; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; transform: translateY(110%); transition: transform .32s cubic-bezier(.3,1,.4,1); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }

  .menu-row { width: 100%; border: none; background: var(--surface-2); border-radius: 14px; padding: 15px 16px; margin-bottom: 9px; display: flex; align-items: center; gap: 13px; cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: var(--ink); }

  .set-group-h.m .gsym { background: var(--teal-soft); color: var(--teal-deep); }

  .set-row .sr-ic { width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; background: var(--surface-2); font-size: 1.3rem; }
  .set-row .sr-n { flex: 1; font-weight: 700; font-size: .95rem; }
  .set-row .sr-meta { font-size: .72rem; color: var(--ink-soft); font-weight: 600; }

<body>

<div class="app">
  <div class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="11.5" cy="20" rx="7.5" ry="5.8" fill="#E56B93"/>
          <path d="M5 17.5 L2.2 15.2 L6 16.7 Z" fill="#E56B93"/>
          <circle cx="15.5" cy="13.8" r="4.6" fill="#E56B93"/>
          <path d="M19.4 13.2 L23.4 12.4 L19.9 15 Z" fill="#F3A53C"/>
          <circle cx="16" cy="12.7" r="1.05" fill="#3A2B33"/>
          <path d="M21 25 c2.6 -1.6 4 -3.1 4 -5 a2.4 2.4 0 0 0 -4 -1.8 a2.4 2.4 0 0 0 -4 1.8 c0 1.9 1.4 3.4 4 5 Z" fill="#2F8F9D"/>
        </svg>
      </div>
      <h1>おしどりの財布</h1>
    </div>
    <button class="gear" id="openMenu" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="monthbar">
    <button id="prevM" aria-label="前の月">‹</button>
    <div class="label num" id="mLabel">2026年 7月</div>
    <button id="nextM" aria-label="次の月">›</button>
  </div>

  <div id="noteWrap"></div>

  <div class="section-head"><h2>口座ごとの入金</h2></div>
  <div id="groups"></div>

  <div class="footer-tip">口座をタップで開くと内訳。右上の ☰ から 口座設定・ブックマーク・集計グラフ へ。<br>データはこのiPhoneの中だけに保存されます。</div>
</div>

<div class="settings-scrim" id="setScrim"></div>
<div class="settings" id="settings">
  <div class="set-top">
    <button class="set-back" id="setClose">‹ もどる</button>
    <h2>口座の設定</h2>
  </div>
  <p class="set-desc">ここで銀行・口座を登録します。毎月の金額の内訳（支払い）は、メイン画面で口座を開いて設定します。</p>
  <div id="setList"></div>
  <button class="btn primary set-add" id="setAdd">＋ 口座を追加</button>
</div>

<div class="page-scrim" id="bmScrim"></div>
<div class="page" id="bmPage">
  <div class="set-top">
    <button class="set-back" id="bmClose">‹ もどる</button>
    <h2>ブックマーク <span class="tag" id="bmCount" style="font-size:.68rem;color:var(--ink-soft);background:var(--surface);padding:2px 8px;border-radius:99px;box-shadow:var(--shadow-sm);font-weight:600;">0件</span></h2>
  </div>
  <p class="set-desc">ボーナス払いの確認など、よく見るページを登録できます。タップで開きます。</p>

    <button class="set-back" id="graphClose">‹ もどる</button>
    <h2>集計グラフ</h2>
  </div>
  <p class="set-desc">月ごとのうつり変わり。入金額の推移を、夫婦会議の材料に。</p>
  <div class="card" id="graphBox"></div>
</div>

<div class="menu-scrim" id="menuScrim"></div>
<div class="menu" id="menu">
  <div class="grip"></div>
  <button class="menu-row" data-open="settings"><span class="mi"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="ml">口座の設定</span><span class="mc">›</span></button>
  <button class="menu-row" data-open="bm"><span class="mi"><svg viewBox="0 0 24 24" fill="none"><path d="M9 15l6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 12.5l-1.7 1.7a3 3 0 0 0 4.2 4.2l2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 11.5l1.7-1.7a3 3 0 0 0-4.2-4.2l-2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="ml">ブックマーク</span><span class="mc">›</span></button>
  <button class="menu-row" data-open="graph"><span class="mi"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="ml">集計グラフ</span><span class="mc">›</span></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <h3 id="sheetTitle">追加</h3>
  <div id="sheetBody"></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="cancelBtn">やめる</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
  <button class="btn del" id="delBtn" style="display:none">削除する</button>
</div>

<script>
(function () {
  "use strict";
  var KEY = "oshidori";
  var LEGACY_KEYS = ["oshidori_v3", "oshidori_v2"];
  var yen = function (n) { return "¥" + (n || 0).toLocaleString("ja-JP"); };
  var comma = function (n) { return (n || 0).toLocaleString("ja-JP"); };
  var $ = function (id) { return document.getElementById(id); };
  var SRC_SYM = { f: "♀", m: "♂", c: "◇" };
  var GROUP_TITLE = { f: "の財布 から", m: "の財布 から", c: "どちらでもない（余裕があれば）" };
  var ICONS = ["🏦", "🏣", "🐖", "💰", "💳", "🏠", "💡", "📱", "🚗", "🎓", "🛡️", "🍚", "👶", "⛽", "🎁", "⭐", "❤️", "✈️"];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function uid() {
    try { if (window.crypto && crypto.randomUUID) return "id-" + crypto.randomUUID(); } catch (e) {}
    uid._c = (uid._c || 0) + 1;
    return "id-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e12).toString(36) + "-" + uid._c;
  }
  function ymNow() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1); }
  function fmtDT(ts) { if (!ts) return ""; var d = new Date(ts); var mm = ("0" + d.getMinutes()).slice(-2); return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + d.getHours() + ":" + mm; }

  var state = load();
  var graphMode = "wallet";
  var openAccts = {};
  save(); // ロード時のID修復・データ移行を確実に保存する

  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
    // 以前のバージョンで保存したデータがあれば、そのまま引き継ぐ（データを失わない）
    for (var li = 0; li < LEGACY_KEYS.length; li++) {
      try {
        var lraw = localStorage.getItem(LEGACY_KEYS[li]);
        if (lraw) { var ls = migrate(JSON.parse(lraw)); try { localStorage.setItem(KEY, JSON.stringify(ls)); } catch (e2) {} return ls; }
      } catch (e3) {}
    }
    var m = ymNow();
    var a1 = uid(), a2 = uid();
    var s = {
      current: m,
      accounts: [
        { id: a1, name: "群馬銀行", icon: "🏦", source: "f", round1000: true, optional: false, memo: "" },
        { id: a2, name: "三井住友銀行", icon: "🏦", source: "f", round1000: true, optional: false, memo: "" }
      ],
      months: {},
      bookmarks: []
    };
    s.months[m] = { acc: {} };
    s.months[m].acc[a1] = { items: [{ id: uid(), name: "妻の歯の矯正（アプラスローン）", amount: 9914, memo: "" }, { id: uid(), name: "妻の車のローン", amount: 11378, memo: "" }], done: false, doneAt: null };
    s.months[m].acc[a2] = { items: [{ id: uid(), name: "お父さんへの教育ローン（パパへの自動送金）", amount: 18000, memo: "" }, { id: uid(), name: "奨学金の返済", amount: 14817, memo: "1000円単位の端数が出るため" }], done: false, doneAt: null };
    return s;
  }
  function migrate(s) {
    if (!s || typeof s !== "object") s = {};
    if (!s.accounts) s.accounts = [];
    if (!s.bookmarks) s.bookmarks = [];
    if (!s.months) s.months = {};
    if (!s.current) s.current = ymNow();
    s.accounts.forEach(function (a) {
      if (typeof a.optional === "undefined") a.optional = false;
      if (typeof a.memo === "undefined") a.memo = "";
      if (typeof a.round1000 === "undefined") a.round1000 = false;
      if (!a.icon) a.icon = "🏦";
      if (!a.source) a.source = "f";
    });
    Object.keys(s.months).forEach(function (mk) {
      var mm = s.months[mk];
      // 給与収入の記録機能は廃止。旧データの wallets は読まない（残っていても無視する）
      if (!mm.acc) mm.acc = {};
      Object.keys(mm.acc).forEach(function (ak) {
        var ma = mm.acc[ak];
        if (!ma.items) ma.items = [];
        ma.items.forEach(function (it) { if (typeof it.memo === "undefined") it.memo = ""; if (typeof it.done === "undefined") it.done = false; if (typeof it.skip === "undefined") it.skip = false; });
      });
    });
    return repairIds(s);
  }

  // 旧バージョンのID生成の不具合で重複したIDを、一意なIDに振り直して修復する
  function repairIds(s) {
    var seen = {}, dup = false;
    s.accounts.forEach(function (a) { if (!a.id || Object.prototype.hasOwnProperty.call(seen, a.id)) dup = true; seen[a.id] = true; });
    if (dup) {
      var remap = [];
      s.accounts.forEach(function (a) { var nu = uid(); remap.push([a.id, nu]); a.id = nu; });
      Object.keys(s.months).forEach(function (mk) {
        var oldAcc = s.months[mk].acc || {}, newAcc = {}, consumed = {};
        remap.forEach(function (r) {
          var oldId = r[0], nu = r[1];
          if (!consumed[oldId] && oldAcc[oldId]) { newAcc[nu] = oldAcc[oldId]; consumed[oldId] = true; }
          else { newAcc[nu] = { items: [], done: false, doneAt: null }; }
        });
        s.months[mk].acc = newAcc;
      });
    }
    // 内訳(item)のIDも、欠落・重複があれば振り直す（外部参照がないので安全）
    var itemSeen = {};
    Object.keys(s.months).forEach(function (mk) {
      var acc = s.months[mk].acc || {};
      Object.keys(acc).forEach(function (ak) {
        (acc[ak].items || []).forEach(function (it) {
          if (!it.id || Object.prototype.hasOwnProperty.call(itemSeen, it.id)) it.id = uid();
          itemSeen[it.id] = true;
        });
      });
    });
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function cur() {
    var c = state.months[state.current];
    if (!c) c = state.months[state.current] = { acc: {} };
    if (!c.acc) c.acc = {};
    return c;
  }
  function monthAcc(month, accId) {
    if (!month.acc) month.acc = {};
    if (!month.acc[accId]) month.acc[accId] = { items: [], done: false, doneAt: null };
    return month.acc[accId];
  }
  function activeItems(ma) { return (ma.items || []).filter(function (x) { return !x.skip; }); }
  function itemsSum(ma) { return activeItems(ma).reduce(function (s, x) { return s + (x.amount || 0); }, 0); }
  function depositTotal(acc, ma) { var s = itemsSum(ma); return (acc && acc.round1000) ? Math.ceil(s / 1000) * 1000 : s; }
  // c口座（どちらでもない）は内訳ごとに入金済みを持つ。♂♀口座は口座単位のma.done。
  function accountFullyDone(acc, ma) {
    if (acc && acc.source === "c") return activeItems(ma).every(function (x) { return x.done; });
    return !!ma.done;
  }
  function findAccount(id) { for (var i = 0; i < state.accounts.length; i++) if (state.accounts[i].id === id) return state.accounts[i]; return null; }

  function shiftMonth(delta) {
    var parts = state.current.split("-");
    var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10);
    mo += delta; while (mo > 12) { mo -= 12; y += 1; } while (mo < 1) { mo += 12; y -= 1; }
    var key = y + "-" + mo;
    if (!state.months[key]) {
      var prev = state.months[state.current];
      var acc = {};
      if (prev) {
        state.accounts.forEach(function (a) {
          var pa = prev.acc && prev.acc[a.id];
          acc[a.id] = { items: (pa ? pa.items : []).map(function (it) { return { id: uid(), name: it.name, amount: it.amount, memo: it.memo || "", done: false, skip: false }; }), done: false, doneAt: null };
        });
      }
      state.months[key] = { acc: acc };
    }
    state.current = key; save(); render();
  }

  function render() {
    var c = cur();
    var parts = state.current.split("-");
    $("mLabel").textContent = parts[0] + "年 " + parts[1] + "月";

    var nw = $("noteWrap"); nw.innerHTML = "";
    var anyAcc = state.accounts.length > 0;
    var allDone = anyAcc && state.accounts.every(function (a) { return accountFullyDone(a, monthAcc(c, a.id)); });
    if (allDone) nw.innerHTML = noteHTML("done", svgHeart(), "今月の入金、ぜんぶ完了！おつかれさま 🌸");

    renderGroups(c);
    renderBookmarks();
    renderGraph();
  }
  function noteHTML(cls, icon, html) { return '<div class="note ' + cls + '">' + icon + "<div>" + html + "</div></div>"; }

  function renderGroups(c) {
    var host = $("groups"); host.innerHTML = "";
    var groups = ["f", "m"];
    if (state.accounts.some(function (a) { return a.source === "c"; })) groups.push("c");
    groups.forEach(function (k) {
      var accs = state.accounts.filter(function (a) { return a.source === k; });
      var g = document.createElement("div");
      g.className = "group " + k;
      var head = document.createElement("div");
      head.className = "group-head";
      head.innerHTML = '<div class="g-title"><span class="gsym">' + SRC_SYM[k] + '</span>' + GROUP_TITLE[k] + '</div>';
      var addb = document.createElement("button");
      addb.className = "add-btn" + (k === "m" ? " teal" : "");
      addb.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>口座を追加';
      addb.addEventListener("click", function () { openAccountSheet(null, k); });
      head.appendChild(addb);
      g.appendChild(head);

      var list = document.createElement("div");
      list.className = "acct-list";
      if (accs.length === 0) list.innerHTML = '<div class="group-empty">' + (k === "c" ? "へそくり・仕送りなど、余裕があれば入金する口座をここに。" : "まだ口座がありません。<br>「＋口座を追加」か ⚙ から登録できます。") + '</div>';
      accs.forEach(function (a) { list.appendChild(accountCard(c, a)); });
      g.appendChild(list);
      host.appendChild(g);
    });
  }

  function accountCard(c, a) {
    var ma = monthAcc(c, a.id);
    var perItem = (a.source === "c");
    var rawSum = itemsSum(ma);
    var total = depositTotal(a, ma);
    var open = !!openAccts[a.id];
    var fullyDone = accountFullyDone(a, ma);
    var el = document.createElement("div");
    el.className = "acct-card" + (fullyDone ? " done" : "") + (open ? " open" : "");

    var pillCls = "todo", pillHTML = "未入金";
    if (perItem) {
      var act0 = activeItems(ma), doneCnt = act0.filter(function (x) { return x.done; }).length;
      if (act0.length > 0 && doneCnt === act0.length) { pillCls = "ok"; pillHTML = svgCheck() + "入金ずみ"; }
      else if (doneCnt > 0) { pillCls = "todo"; pillHTML = doneCnt + "/" + act0.length + " 入金"; }
    } else if (ma.done) { pillCls = "ok"; pillHTML = svgCheck() + "入金ずみ"; }

    var head = document.createElement("div");
    head.className = "ac-head";
    head.innerHTML =
      '<div class="ac-ic">' + (a.icon || "🏦") + '</div>' +
      '<div class="ac-name"><div class="n"></div><div class="sub"></div></div>' +
      '<div class="ac-right">' +
        '<div class="ac-amt"><span class="yen">¥</span>' + comma(total) + '</div>' +
        '<div class="ac-pill ' + pillCls + '">' + pillHTML + '</div>' +
      '</div>' +
      '<div class="ac-arrow">›</div>';
    head.querySelector(".n").textContent = a.name;
    var skipCnt = (ma.items || []).filter(function (x) { return x.skip; }).length;
    var subTxt = (a.optional ? "任意入金 ・ " : "") + ma.items.length + "件の内訳";
    if (perItem && skipCnt > 0) subTxt += " ・ " + skipCnt + "件おやすみ";
    if (!perItem && ma.done && ma.doneAt) subTxt += " ・ " + fmtDT(ma.doneAt) + " 入金";

  function monthKeys() {
    return Object.keys(state.months).sort(function (a, b) { var pa = a.split("-").map(Number), pb = b.split("-").map(Number); return pa[0] - pb[0] || pa[1] - pb[1]; });
  }
  function sparkline(vals, color) {
    var W = 92, H = 30, n = vals.length, max = Math.max(1, Math.max.apply(null, vals));
    var slot = W / n, bw = Math.min(12, slot * 0.62);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
    vals.forEach(function (v, i) { if (v <= 0) return; var h = Math.max(2, (v / max) * (H - 3)), x = slot * i + slot / 2; s += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + color + '" opacity="' + (i === n - 1 ? 1 : 0.36) + '"/>'; });
    return s + '</svg>';
  }
  function monthAllocByAccount(mkey, accId) { var mm = state.months[mkey]; if (!mm || !mm.acc || !mm.acc[accId]) return 0; return depositTotal(findAccount(accId), mm.acc[accId]); }

  function renderGraph() {
    var host = $("graphBox");
    var keys = monthKeys().slice(-6);
    var seg = '<div class="gseg" id="gseg">' +
      '<button data-g="wallet"' + (graphMode === "wallet" ? ' class="on"' : "") + '>財布ごと</button>' +
      '<button data-g="dest"' + (graphMode === "dest" ? ' class="on"' : "") + '>口座ごと</button></div>';
    host.innerHTML = seg + (graphMode === "wallet" ? walletGraph(keys) : destGraph(keys));
    Array.prototype.forEach.call(document.querySelectorAll("#gseg button"), function (b) {
      b.addEventListener("click", function () { graphMode = b.getAttribute("data-g"); renderGraph(); });
    });
  }
  function walletGraph(keys) {
    var data = keys.map(function (k) {
      var mm = state.months[k], tm = 0, tf = 0;
      state.accounts.forEach(function (a) { var v = monthAllocByAccount(k, a.id); if (a.source === "m") tm += v; else tf += v; });
      return { mo: parseInt(k.split("-")[1], 10), m: tm, f: tf, t: tm + tf };
    });
    var maxV = Math.max(1, Math.max.apply(null, data.map(function (d) { return d.t; })));
    var W = 320, H = 150, padB = 22, padT = 8, padL = 6, padR = 6, innerH = H - padB - padT;
    var slot = (W - padL - padR) / data.length, bw = Math.min(38, slot * 0.56);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
    svg += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--line)" stroke-width="1"/>';
    data.forEach(function (d, i) {
      var x = padL + slot * i + slot / 2, base = H - padB;
      var hF = d.t > 0 ? (d.f / maxV) * innerH : 0, hM = d.t > 0 ? (d.m / maxV) * innerH : 0;
      if (hF > 0) svg += '<rect x="' + (x - bw / 2) + '" y="' + (base - hF) + '" width="' + bw + '" height="' + hF + '" rx="3" fill="var(--rose)"/>';
      if (hM > 0) svg += '<rect x="' + (x - bw / 2) + '" y="' + (base - hF - hM) + '" width="' + bw + '" height="' + hM + '" rx="3" fill="var(--teal)"/>';
      svg += '<text x="' + x + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="var(--font-round)">' + d.mo + '月</text>';
    });
    svg += '</svg>';
    var legend = '<div class="chart-legend"><span><span class="dot" style="background:var(--teal)"></span>♂の財布</span><span><span class="dot" style="background:var(--rose)"></span>♀の財布</span></div>';
    if (data.length <= 1) return legend + svg + '<div class="chart-note">月を切り替えて記録していくと、<br>ここに増減のグラフが育ちます 🌱</div>';
    var ck = keys[keys.length - 1], pk = keys[keys.length - 2], byA = {};
    state.accounts.forEach(function (a) { byA[a.id] = { name: a.name, now: monthAllocByAccount(ck, a.id), prev: monthAllocByAccount(pk, a.id) }; });
    var rows = Object.keys(byA).map(function (id) { return byA[id]; }).filter(function (r) { return r.now > 0 || r.prev > 0; }).sort(function (a, b) { return b.now - a.now; });
    var diff = '<div class="diff"><div class="dh">先月（' + parseInt(pk.split("-")[1], 10) + '月）とくらべて</div>';
    rows.forEach(function (r) {
      var d = r.now - r.prev, cls = d > 0 ? "up" : (d < 0 ? "down" : "same"), txt = d > 0 ? "▲ " + comma(d) : (d < 0 ? "▼ " + comma(-d) : "±0");
      diff += '<div class="diff-row"><span class="dn">' + esc(r.name) + '</span><span class="dv"><span class="now">' + yen(r.now) + '</span><span class="delta ' + cls + '">' + txt + '</span></span></div>';
    });
    return legend + svg + diff + '</div>';
  }
  function destGraph(keys) {
    if (state.accounts.length === 0) return '<div class="chart-note">口座を登録すると、<br>ここに口座ごとの推移が出ます 🌱</div>';
    var rows = state.accounts.map(function (a) {
      var vals = keys.map(function (k) { return monthAllocByAccount(k, a.id); });
      return { a: a, vals: vals, latest: vals[vals.length - 1], prev: vals.length > 1 ? vals[vals.length - 2] : 0 };
    }).filter(function (r) { return r.vals.some(function (v) { return v > 0; }); }).sort(function (a, b) { return b.latest - a.latest; });
    if (rows.length === 0) return '<div class="chart-note">内訳を入れると、<br>ここに口座ごとの推移が出ます 🌱</div>';
    var html = '<div class="chart-legend"><span>口座ごとの月ごと推移（最新月が濃い色）</span></div>';
    rows.forEach(function (r) {
      var color = r.a.source === "m" ? "var(--teal)" : "var(--rose)";
      var d = r.latest - r.prev, cls = d > 0 ? "up" : (d < 0 ? "down" : "same");
      var dtxt = keys.length < 2 ? "" : (d > 0 ? "▲" + comma(d) : (d < 0 ? "▼" + comma(-d) : "±0"));
      html += '<div class="spark-row"><div class="sr-name"><span class="sr-ic">' + (r.a.icon || "🏦") + '</span>' + esc(r.a.name) + '</div>' + sparkline(r.vals, color) + '<div class="sr-val">' + yen(r.latest) + '<div class="delta ' + cls + '" style="font-size:.68rem;font-weight:700">' + dtxt + '</div></div></div>';
    });
    return html;
  }

  function setSeg() { Array.prototype.forEach.call($("segSrc").children, function (b) { var s = b.getAttribute("data-s"); b.className = (s === formSource ? "on " + s : ""); }); }

  $("saveBtn").addEventListener("click", function () {
    if (sheetType === "account") {

      delete openAccts[editId];

      var ma = monthAcc(cur(), formAccId);
      ma.items = ma.items.filter(function (x) { return x.id !== editId; });

      state.bookmarks = state.bookmarks.filter(function (b) { return b.id !== editId; });
