<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おかね振り分けノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おかね振り分け">
<meta name="theme-color" content="#FBF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #FBF3F0;
    --surface: #FFFFFF;
    --surface-2: #FDF7F5;
    --ink: #3A2B33;
    --ink-soft: #93777F;
    --rose: #E56B93;
    --rose-deep: #C9527B;
    --rose-soft: #FBE3EC;
    --sage: #4E9E80;
    --sage-soft: #E1F0E9;
    --amber: #D68A38;
    --amber-soft: #FBEEDC;
    --line: #F0E1E5;
    --shadow: 0 6px 22px rgba(200, 120, 150, 0.14);
    --shadow-sm: 0 2px 8px rgba(200, 120, 150, 0.12);
    --radius: 20px;
    --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
      --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
      --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
      --line: #3D2C37; --shadow: 0 6px 22px rgba(0, 0, 0, 0.35); --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #FBF3F0; --surface: #FFFFFF; --surface-2: #FDF7F5; --ink: #3A2B33;
    --ink-soft: #93777F; --rose: #E56B93; --rose-deep: #C9527B; --rose-soft: #FBE3EC;
    --sage: #4E9E80; --sage-soft: #E1F0E9; --amber: #D68A38; --amber-soft: #FBEEDC;
    --line: #F0E1E5; --shadow: 0 6px 22px rgba(200,120,150,0.14); --shadow-sm: 0 2px 8px rgba(200,120,150,0.12);
  }
  :root[data-theme="dark"] {
    --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
    --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
    --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
    --line: #3D2C37; --shadow: 0 6px 22px rgba(0,0,0,0.35); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }

  .app {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 90% -10%, var(--rose-soft) 0%, transparent 55%),
      radial-gradient(120% 90% at 0% 0%, var(--sage-soft) 0%, transparent 45%),
      var(--bg);
    min-height: 100vh;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, var(--rose) 0%, var(--rose-deep) 100%);
    box-shadow: var(--shadow-sm); display: grid; place-items: center;
  }
  .brand .mark svg { width: 19px; height: 19px; }
  .brand h1 { font-family: var(--font-round); font-size: 1.06rem; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button {
    width: 34px; height: 34px; border-radius: 11px; border: none;
    background: var(--surface); color: var(--rose); box-shadow: var(--shadow-sm);
    font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; transition: transform .12s ease;
  }
  .month-nav button:active { transform: scale(.9); }
  .month-nav .label { font-family: var(--font-round); font-weight: 700; font-size: .95rem; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }

  .summary { background: var(--surface); border-radius: var(--radius); padding: 20px 20px 18px; box-shadow: var(--shadow); margin-bottom: 22px; position: relative; overflow: hidden; }
  .summary .cap { font-size: .74rem; color: var(--ink-soft); font-weight: 600; letter-spacing: .04em; }
  .summary .total { font-family: var(--font-round); font-weight: 800; font-size: 2.35rem; line-height: 1.1; margin: 2px 0 2px; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 3px; }
  .summary .total .yen { font-size: 1.3rem; font-weight: 700; color: var(--ink-soft); }
  .summary .sub { font-size: .82rem; color: var(--ink-soft); margin-bottom: 15px; }
  .summary .sub b { color: var(--rose-deep); font-family: var(--font-round); }

  .bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; box-shadow: inset 0 1px 3px rgba(0,0,0,.06); }
  .bar .fill { background: linear-gradient(90deg, var(--sage) 0%, #6FBE9E 100%); height: 100%; width: 0; transition: width .5s cubic-bezier(.4,1.2,.5,1); }
  .legend { display: flex; gap: 16px; margin-top: 13px; flex-wrap: wrap; }
  .legend .item { display: flex; flex-direction: column; gap: 1px; }
  .legend .k { font-size: .7rem; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }
  .legend .k .dot { width: 8px; height: 8px; border-radius: 99px; }
  .legend .v { font-family: var(--font-round); font-weight: 700; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .dot.sage { background: var(--sage); }
  .dot.amber { background: var(--amber); }
  .dot.rose { background: var(--rose); }

  .note { margin-top: 14px; font-size: .8rem; border-radius: 13px; padding: 10px 13px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .note.warn { background: var(--amber-soft); color: var(--amber); }
  .note.done { background: var(--sage-soft); color: var(--sage); }
  .note svg { flex: none; width: 16px; height: 16px; margin-top: 1px; }
  .note.hide { display: none; }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 11px; }
  .section-head h2 { font-family: var(--font-round); font-size: 1rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
  .section-head h2 .tag { font-size: .68rem; font-weight: 600; color: var(--ink-soft); background: var(--surface); padding: 2px 8px; border-radius: 99px; font-family: var(--font-body); box-shadow: var(--shadow-sm); }
  .add-btn { border: none; background: none; color: var(--rose); font-family: var(--font-body); font-weight: 700; font-size: .85rem; cursor: pointer; padding: 4px 6px; display: flex; align-items: center; gap: 4px; border-radius: 10px; }
  .add-btn:active { background: var(--rose-soft); }
  .add-btn svg { width: 15px; height: 15px; }

  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }

  .row { background: var(--surface); border-radius: 15px; padding: 13px 15px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform .1s ease; }
  .row:active { transform: scale(.99); }
  .row .ic { width: 36px; height: 36px; border-radius: 11px; flex: none; display: grid; place-items: center; background: var(--rose-soft); color: var(--rose-deep); }
  .row .ic svg { width: 18px; height: 18px; }
  .row .name { flex: 1; font-weight: 600; font-size: .95rem; }
  .row .amt { font-family: var(--font-round); font-weight: 700; font-size: 1.08rem; font-variant-numeric: tabular-nums; }
  .row .amt .yen { font-size: .82rem; color: var(--ink-soft); font-weight: 600; margin-right: 1px; }

  .acct { background: var(--surface); border-radius: 16px; padding: 14px 15px 13px; box-shadow: var(--shadow-sm); border: 1.5px solid transparent; transition: border-color .2s ease, background .2s ease; }
  .acct.done { border-color: color-mix(in srgb, var(--sage) 40%, transparent); background: color-mix(in srgb, var(--sage-soft) 55%, var(--surface)); }
  .acct .a-top { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .acct .a-ic { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--rose-deep); font-family: var(--font-round); font-weight: 800; font-size: 1.05rem; }
  .acct.done .a-ic { background: var(--sage-soft); color: var(--sage); }
  .acct .a-name { flex: 1; }
  .acct .a-name .n { font-weight: 700; font-size: .97rem; }
  .acct .a-name .memo { font-size: .74rem; color: var(--ink-soft); margin-top: 1px; }
  .acct .a-amt { text-align: right; font-family: var(--font-round); font-weight: 700; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
  .acct .a-amt .yen { font-size: .8rem; color: var(--ink-soft); font-weight: 600; margin-right: 1px; }

  .check { margin-top: 12px; width: 100%; border: none; cursor: pointer; border-radius: 12px; padding: 11px; font-family: var(--font-body); font-weight: 700; font-size: .9rem; display: flex; align-items: center; justify-content: center; gap: 7px; transition: transform .1s ease; }
  .check:active { transform: scale(.98); }
  .check svg { width: 17px; height: 17px; }
  .check.todo { background: var(--amber-soft); color: var(--amber); }
  .check.ok { background: var(--sage); color: #fff; }
  @media (prefers-color-scheme: dark) { .check.ok { color: #12241C; } }
  :root[data-theme="dark"] .check.ok { color: #12241C; }
  :root[data-theme="light"] .check.ok { color: #fff; }

  .empty { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 22px 10px; background: var(--surface); border-radius: 15px; box-shadow: var(--shadow-sm); border: 1.5px dashed var(--line); }

  .footer-tip { text-align: center; color: var(--ink-soft); font-size: .74rem; line-height: 1.6; margin-top: 8px; padding: 0 10px; }

  .scrim { position: fixed; inset: 0; background: rgba(40, 25, 35, .45); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 40; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; transform: translateY(110%); transition: transform .32s cubic-bezier(.3,1,.4,1); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 16px; }
  .sheet h3 { font-family: var(--font-round); font-size: 1.15rem; margin: 0 0 18px; font-weight: 700; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: .78rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 7px; }
  .field input { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 13px; padding: 13px 14px; font-size: 1.05rem; font-family: var(--font-body); outline: none; transition: border-color .15s ease; }
  .field input:focus { border-color: var(--rose); }
  .field input.amt-input { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .chip { border: none; background: var(--rose-soft); color: var(--rose-deep); cursor: pointer; border-radius: 99px; padding: 6px 12px; font-size: .8rem; font-weight: 600; font-family: var(--font-body); }
  .chip:active { background: var(--rose); color: #fff; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; border: none; border-radius: 14px; padding: 14px; font-size: .98rem; font-weight: 700; font-family: var(--font-body); cursor: pointer; transition: transform .1s ease; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(140deg, var(--rose) 0%, var(--rose-deep) 100%); color: #fff; box-shadow: var(--shadow-sm); }
  .btn.ghost { flex: 0 0 auto; background: var(--surface-2); color: var(--ink-soft); padding: 14px 18px; }
  .btn.del { background: none; color: #D9534F; width: 100%; flex: none; margin-top: 4px; padding: 12px; font-weight: 600; font-size: .85rem; }
  @media (prefers-color-scheme: dark) { .btn.del { color: #F09B98; } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21c5-3.2 8-6.3 8-10.2A4.8 4.8 0 0 0 12 7a4.8 4.8 0 0 0-8 3.8C4 14.7 7 17.8 12 21Z" fill="#fff" opacity=".95"/>
        </svg>
      </div>
      <h1>おかね振り分けノート</h1>
    </div>
    <div class="month-nav">
      <button id="prevM" aria-label="前の月">‹</button>
      <div class="label num" id="mLabel">2026年 7月</div>
      <button id="nextM" aria-label="次の月">›</button>
    </div>
  </div>

  <div class="summary">
    <div class="cap">今月の収入（2人合わせて）</div>
    <div class="total num"><span class="yen">¥</span><span id="incomeTotal">0</span></div>
    <div class="sub">このうち <b id="allocTotal">¥0</b> を各口座へ振り分け予定</div>
    <div class="bar"><div class="fill" id="barFill"></div></div>
    <div class="legend">
      <div class="item">
        <div class="k"><span class="dot sage"></span>振込ずみ</div>
        <div class="v num" id="doneAmt">¥0</div>
      </div>
      <div class="item">
        <div class="k"><span class="dot amber"></span>これから</div>
        <div class="v num" id="todoAmt">¥0</div>
      </div>
      <div class="item">
        <div class="k"><span class="dot rose"></span>手元に残る</div>
        <div class="v num" id="leftAmt">¥0</div>
      </div>
    </div>
    <div class="note hide" id="noteBox"></div>
  </div>

  <div class="section-head">
    <h2>収入 <span class="tag" id="incCount">0件</span></h2>
    <button class="add-btn" id="addInc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      追加
    </button>
  </div>
  <div class="list" id="incomeList"></div>

  <div class="section-head">
    <h2>振り分け先 <span class="tag" id="accCount">0件</span></h2>
    <button class="add-btn" id="addAcc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      追加
    </button>
  </div>
  <div class="list" id="accountList"></div>

  <div class="footer-tip">項目をタップすると金額や名前を直せます。<br>データはこのiPhoneの中だけに保存されます。</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <h3 id="sheetTitle">追加</h3>
  <div class="field">
    <label id="lblName">名前</label>
    <input type="text" id="fName" placeholder="例：夫の給与" autocomplete="off">
    <div class="chips" id="nameChips"></div>
  </div>
  <div class="field">
    <label id="lblAmt">金額</label>
    <input type="text" id="fAmt" class="amt-input" inputmode="numeric" placeholder="0">
  </div>
  <div class="sheet-actions">
    <button class="btn ghost" id="cancelBtn">やめる</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
  <button class="btn del" id="delBtn" style="display:none">この項目を削除</button>
</div>

<script>
(function () {
  "use strict";
  var KEY = "okane_wakefuri_v1";
  var yen = function (n) { return "¥" + (n || 0).toLocaleString("ja-JP"); };
  var $ = function (id) { return document.getElementById(id); };

  var incomeChips = ["夫の給与", "妻の給与", "ボーナス", "その他収入"];
  var acctChips = ["家賃・住宅ローン", "カード引き落とし", "光熱費・通信", "生活費", "貯金", "教育費"];

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var m = ymNow();
    var s = { current: m, months: {} };
    s.months[m] = {
      incomes: [
        { id: uid(), name: "夫の給与", amount: 280000 },
        { id: uid(), name: "妻の給与", amount: 150000 }
      ],
      accounts: [
        { id: uid(), name: "家賃・住宅ローン", target: 95000, done: false },
        { id: uid(), name: "カード引き落とし", target: 80000, done: false },
        { id: uid(), name: "光熱費・通信", target: 35000, done: false },
        { id: uid(), name: "貯金", target: 50000, done: false }
      ]
    };
    return s;
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return "id" + Math.floor((performance.now() % 1) * 1e9) + "_" + (uid._c = (uid._c || 0) + 1); }
  function ymNow() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1); }

  function cur() {
    if (!state.months[state.current]) state.months[state.current] = { incomes: [], accounts: [] };
    return state.months[state.current];
  }

  function shiftMonth(delta) {
    var parts = state.current.split("-");
    var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10);
    mo += delta;
    while (mo > 12) { mo -= 12; y += 1; }
    while (mo < 1) { mo += 12; y -= 1; }
    var key = y + "-" + mo;
    if (!state.months[key]) {
      var prev = state.months[state.current];
      var inc = [], acc = [];
      if (prev) {
        prev.incomes.forEach(function (x) { inc.push({ id: uid(), name: x.name, amount: x.amount }); });
        prev.accounts.forEach(function (x) { acc.push({ id: uid(), name: x.name, target: x.target, done: false }); });
      }
      state.months[key] = { incomes: inc, accounts: acc };
    }
    state.current = key;
    save();
    render();
  }

  function render() {
    var c = cur();
    var parts = state.current.split("-");
    $("mLabel").textContent = parts[0] + "年 " + parts[1] + "月";

    var incTotal = c.incomes.reduce(function (s, x) { return s + (x.amount || 0); }, 0);
    var allocTotal = c.accounts.reduce(function (s, x) { return s + (x.target || 0); }, 0);
    var doneTotal = c.accounts.reduce(function (s, x) { return s + (x.done ? (x.target || 0) : 0); }, 0);
    var todoTotal = allocTotal - doneTotal;
    var left = incTotal - allocTotal;

    $("incomeTotal").textContent = incTotal.toLocaleString("ja-JP");
    $("allocTotal").textContent = yen(allocTotal);
    $("doneAmt").textContent = yen(doneTotal);
    $("todoAmt").textContent = yen(todoTotal);
    $("leftAmt").textContent = yen(left);
    $("leftAmt").style.color = left < 0 ? "#D9534F" : "";

    var pct = allocTotal > 0 ? Math.round(doneTotal / allocTotal * 100) : 0;
    $("barFill").style.width = pct + "%";

    var note = $("noteBox");
    var allDone = c.accounts.length > 0 && c.accounts.every(function (x) { return x.done; });
    if (left < 0) {
      note.className = "note warn";
      note.innerHTML = svgAlert() + "<div>振り分けが収入より <b>" + yen(-left) + "</b> 多いです。金額を見直してね。</div>";
    } else if (allDone) {
      note.className = "note done";
      note.innerHTML = svgHeart() + "<div>今月の振り分け、ぜんぶ完了！おつかれさま 🌸</div>";
    } else {
      note.className = "note hide";
    }

    $("incCount").textContent = c.incomes.length + "件";
    var il = $("incomeList");
    il.innerHTML = "";
    if (c.incomes.length === 0) il.innerHTML = '<div class="empty">「＋追加」で給与を登録してね</div>';
    c.incomes.forEach(function (x) {
      var el = document.createElement("div");
      el.className = "row";
      el.innerHTML =
        '<div class="ic">' + svgWallet() + '</div>' +
        '<div class="name"></div>' +
        '<div class="amt"><span class="yen">¥</span><span class="v"></span></div>';
      el.querySelector(".name").textContent = x.name;
      el.querySelector(".v").textContent = (x.amount || 0).toLocaleString("ja-JP");
      el.addEventListener("click", function () { openSheet("income", x.id); });
      il.appendChild(el);
    });

    $("accCount").textContent = c.accounts.length + "件";
    var al = $("accountList");
    al.innerHTML = "";
    if (c.accounts.length === 0) al.innerHTML = '<div class="empty">「＋追加」で振り分け先の口座を登録してね</div>';
    c.accounts.forEach(function (x) {
      var el = document.createElement("div");
      el.className = "acct" + (x.done ? " done" : "");
      var initial = (x.name || "口").slice(0, 1);
      el.innerHTML =
        '<div class="a-top">' +
          '<div class="a-ic"></div>' +
          '<div class="a-name"><div class="n"></div><div class="memo"></div></div>' +
          '<div class="a-amt"><span class="yen">¥</span><span class="v"></span></div>' +
        '</div>' +
        '<button class="check ' + (x.done ? "ok" : "todo") + '">' +
          (x.done ? svgCheck() + "振込ずみ" : svgCircle() + "この口座に振り込む") +
        '</button>';
      el.querySelector(".a-ic").textContent = initial;
      el.querySelector(".n").textContent = x.name;
      el.querySelector(".memo").textContent = x.done ? "振込ずみ" : "未振込";
      el.querySelector(".a-amt .v").textContent = (x.target || 0).toLocaleString("ja-JP");
      el.querySelector(".a-top").addEventListener("click", function () { openSheet("account", x.id); });
      el.querySelector(".check").addEventListener("click", function (ev) {
        ev.stopPropagation();
        x.done = !x.done;
        save();
        render();
      });
      al.appendChild(el);
    });
  }

  var sheetMode = null;
  var editId = null;

  function openSheet(mode, id) {
    sheetMode = mode;
    editId = id || null;
    var isInc = mode === "income";
    $("sheetTitle").textContent = (id ? "編集" : "追加") + "・" + (isInc ? "収入" : "振り分け先");
    $("lblName").textContent = isInc ? "名前" : "口座・支払いの名前";
    $("lblAmt").textContent = isInc ? "入金額" : "この口座へ入れる金額";
    $("fName").placeholder = isInc ? "例：夫の給与" : "例：家賃・住宅ローン";

    var chips = $("nameChips");
    chips.innerHTML = "";
    (isInc ? incomeChips : acctChips).forEach(function (t) {
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = t;
      b.addEventListener("click", function () { $("fName").value = t; });
      chips.appendChild(b);
    });

    var name = "", amt = "";
    if (id) {
      var item = find(mode, id);
      if (item) { name = item.name; amt = isInc ? item.amount : item.target; }
    }
    $("fName").value = name;
    $("fAmt").value = amt ? amt.toLocaleString("ja-JP") : "";
    $("delBtn").style.display = id ? "block" : "none";

    $("scrim").classList.add("show");
    $("sheet").classList.add("show");
  }

  function closeSheet() {
    $("scrim").classList.remove("show");
    $("sheet").classList.remove("show");
    if (document.activeElement) document.activeElement.blur();
  }

  function find(mode, id) {
    var arr = mode === "income" ? cur().incomes : cur().accounts;
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  function parseAmt(v) {
    var n = parseInt(String(v).replace(/[^0-9]/g, ""), 10);
    return isNaN(n) ? 0 : n;
  }

  $("saveBtn").addEventListener("click", function () {
    var name = $("fName").value.trim();
    var amt = parseAmt($("fAmt").value);
    if (!name) { $("fName").focus(); return; }
    var c = cur();
    if (sheetMode === "income") {
      if (editId) { var it = find("income", editId); it.name = name; it.amount = amt; }
      else { c.incomes.push({ id: uid(), name: name, amount: amt }); }
    } else {
      if (editId) { var ac = find("account", editId); ac.name = name; ac.target = amt; }
      else { c.accounts.push({ id: uid(), name: name, target: amt, done: false }); }
    }
    save();
    closeSheet();
    render();
  });

  $("delBtn").addEventListener("click", function () {
    if (!editId) return;
    var c = cur();
    var arr = sheetMode === "income" ? c.incomes : c.accounts;
    for (var i = 0; i < arr.length; i++) if (arr[i].id === editId) { arr.splice(i, 1); break; }
    save();
    closeSheet();
    render();
  });

  $("fAmt").addEventListener("input", function () {
    var n = parseAmt(this.value);
    this.value = n ? n.toLocaleString("ja-JP") : "";
  });

  $("cancelBtn").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  $("addInc").addEventListener("click", function () { openSheet("income", null); });
  $("addAcc").addEventListener("click", function () { openSheet("account", null); });
  $("prevM").addEventListener("click", function () { shiftMonth(-1); });
  $("nextM").addEventListener("click", function () { shiftMonth(1); });

  function svgWallet() { return '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M16 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 9h13a2 2 0 0 1 2 2" stroke="currentColor" stroke-width="1.8"/></svg>'; }
  function svgCheck() { return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgCircle() { return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/></svg>'; }
  function svgAlert() { return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor"/><path d="M12 4l9 16H3L12 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'; }
  function svgHeart() { return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20c4.5-2.8 7-5.5 7-8.9A4.2 4.2 0 0 0 12 7.5 4.2 4.2 0 0 0 5 11.1C5 14.5 7.5 17.2 12 20Z" fill="currentColor"/></svg>'; }

  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
